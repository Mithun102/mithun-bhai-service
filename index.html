<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मिथुन भाई सर्विस</title><style>
body{margin:0;background:#08172e;color:#fff;font:16px system-ui;text-align:center}.wrap{max-width:650px;margin:8vh auto;padding:24px}.box{background:#122a49;padding:26px;border:1px solid #315781;border-radius:20px}h1{font-size:36px}b{color:#ffd21c}button{background:#1677ff;color:#fff;border:0;border-radius:10px;padding:13px 20px;font-weight:bold}input{padding:12px;border-radius:9px;border:0;width:90%;margin:10px}p{color:#c1d2e8}</style></head><body><div class="wrap"><div class="box"><h1>मिथुन <b>भाई</b> सर्विस</h1><h2>Buy Your ID</h2><p>Available Stock: <strong id="stock">लोड हो रहा है…</strong></p><p>Price Per ID: <strong id="rate">लोड हो रहा है…</strong></p><button onclick="setQ(2)">2 ID</button> <button onclick="setQ(5)">5 ID</button> <button onclick="setQ(10)">10 ID</button> <button onclick="setQ(20)">20 ID</button><p>Custom Quantity</p><input id="q" type="number" min="1" max="100" value="2"><h3>Total: <b id="total">—</b></h3><button onclick="buy()">Continue to Payment</button><p id="msg"></p></div></div><script>
let rate=0;const fmt=n=>'₹'+Number(n).toLocaleString('en-IN');function setQ(n){q.value=n;calc()}function calc(){total.textContent=fmt((+q.value||0)*rate)}q.oninput=calc;
fetch('/api/storefront').then(r=>r.json()).then(d=>{rate=d.rate;stock.textContent=d.stock+' IDs';document.getElementById('rate').textContent=fmt(rate)+' / ID';calc()}).catch(()=>{stock.textContent='Unavailable';rate=0;calc()});
async function buy(){msg.textContent='';let n=+q.value;if(!Number.isInteger(n)||n<1||n>100){msg.textContent='Quantity 1 से 100 के बीच रखें।';return}let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quantity:n})});let d=await r.json();msg.textContent=d.error||'Order बनाया गया। Razorpay Checkout UI जोड़ना अगला integration step है।';}
</script></body></html>
